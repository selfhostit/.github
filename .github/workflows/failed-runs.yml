name: Failed runs

# Once a day, sends one ntfy message listing the workflows that failed in the last
# 24 hours across every selfhostit repository. Sends nothing when all is green.
# Setup: README in .github/scripts/failed-runs.md.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: Look back this many hours
        default: '24'
      always_notify:
        description: Send a message even when nothing failed (to test ntfy)
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report failed runs
        env:
          ORG: ${{ github.repository_owner }}
          HOURS: ${{ inputs.hours || '24' }}
          ALWAYS_NOTIFY: ${{ inputs.always_notify || 'false' }}
          # Public repositories are readable with the default token. To include
          # private ones, add a fine-grained token with Actions: read as ACTIONS_READ_TOKEN.
          GH_TOKEN: ${{ secrets.ACTIONS_READ_TOKEN || github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
        run: .github/scripts/failed-runs.sh
      - name: Say the check itself failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          auth=()
          [ -z "$NTFY_TOKEN" ] || auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          curl -fsS -o /dev/null "${auth[@]}" -H "Title: Daily failed-runs check broke" \
            -H "Tags: warning" -H "Click: $RUN_URL" \
            -d "The daily check could not finish. See $RUN_URL" "${NTFY_SERVER%/}/$NTFY_TOPIC"
