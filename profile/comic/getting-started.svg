<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 820" width="1220" height="820" font-family="'Comic Sans MS','Comic Neue','Chalkboard SE','Segoe Print',cursive" role="img" aria-labelledby="t d">
<title id="t">Getting started with selfhostit, in six panels</title>
<desc id="d">A stick figure finds an old laptop or a Raspberry Pi, puts Linux on it and plugs it in, pastes one install command, ticks the apps it wants, taps one link to sign in to Tailscale, and then uses the apps on its phone while the data stays at home.</desc>
<defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>
<g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(20 20)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">1</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Find a little computer*</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">*a Pi 3 or newer, a mini PC, a laptop, a NAS</text><g filter="url(#wob)"><path d="M40 175 L130 175 L130 235 L40 235 Z" fill="#dfe6ee"/><path d="M30 235 L140 235 L148 247 L22 247 Z" fill="#c9d2dc"/><path d="M40 175 L58 193 M40 188 L52 175 M44 182 Q50 186 52 179" stroke-width="1.5"/><text x="85" y="212" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="none">dusty</text><circle cx="195" cy="150" r="17" fill="#fffdf5"/><path d="M195 167 L195 229"/><path d="M195 177 L140 187"/><path d="M195 177 L265 172"/><path d="M195 229 L170 291"/><path d="M195 229 L220 291"/><circle cx="189" cy="147" r="2" fill="#222" stroke="none"/><circle cx="201" cy="147" r="2" fill="#222" stroke="none"/><path d="M187 154 Q195 165 203 154 Z" fill="#222"/><rect x="250" y="205" width="92" height="60" rx="6" fill="#2ea44f"/><rect x="268" y="220" width="24" height="24" fill="#222"/><circle cx="256" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="265" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="274" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="283" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="292" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="301" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="310" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="319" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="328" cy="211" r="2" fill="#ffd84d" stroke="none"/><circle cx="337" cy="211" r="2" fill="#ffd84d" stroke="none"/><rect x="318" y="228" width="26" height="18" fill="#bbb"/></g><text x="296" y="290" text-anchor="middle" font-size="14" fill="#222" stroke="none">or a tiny Pi</text><text x="85" y="275" text-anchor="middle" font-size="14" fill="#222" stroke="none">an old laptop</text><g filter="url(#wob)"><rect x="115" y="62" width="200" height="58" rx="18" fill="#fff"/><path d="M203.0 117 L200 128 L225.0 117 Z" fill="#fff" stroke="none"/><path d="M203.0 120 L200 128 L225.0 120"/></g><text x="215.0" y="86.95" text-anchor="middle" font-size="17" fill="#222" stroke="none"><tspan x="215.0" dy="0">This old thing?</tspan><tspan x="215.0" dy="20">Perfect!</tspan></text></g>
<g transform="translate(420 20)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">2</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Give it Linux, plug it in</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">Raspberry Pi Imager does the Linux part for a Pi</text><g filter="url(#wob)"><rect x="200" y="235" width="80" height="50" rx="6" fill="#2ea44f"/><circle cx="270" cy="245" r="5" fill="#3f3" stroke="none"/><path d="M282 275 C320 275 320 250 345 250" fill="none"/><rect x="342" y="236" width="22" height="30" rx="4" fill="#fff"/><path d="M350 245 L350 252 M356 245 L356 252" stroke-width="2"/><path d="M215 222 Q220 212 215 202 M240 220 Q245 208 240 196 M265 222 Q270 212 265 202" fill="none" stroke-width="2"/><path d="M0 290 L380 290" stroke-width="2"/><circle cx="110" cy="140" r="17" fill="#fffdf5"/><path d="M110 157 L110 219"/><path d="M110 167 L60 127"/><path d="M110 167 L165 122"/><path d="M110 219 L88 283"/><path d="M110 219 L132 283"/><circle cx="104" cy="137" r="2" fill="#222" stroke="none"/><circle cx="116" cy="137" r="2" fill="#222" stroke="none"/><circle cx="110" cy="147" r="3.5" fill="none"/><rect x="160" y="96" width="22" height="28" rx="2" fill="#4a90d9"/><path d="M166 96 L166 103 M171 96 L171 103 M176 96 L176 103" stroke-width="1.5"/></g><g filter="url(#wob)"><rect x="200" y="70" width="150" height="54" rx="18" fill="#fff"/><path d="M263.0 121 L225 195 L285.0 121 Z" fill="#fff" stroke="none"/><path d="M263.0 124 L225 195 L285.0 124"/></g><text x="275.0" y="103.65" text-anchor="middle" font-size="19" fill="#222" stroke="none"><tspan x="275.0" dy="0">It hums!</tspan></text></g>
<g transform="translate(820 20)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">3</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Paste one line</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">in a terminal on it, or over SSH</text><g filter="url(#wob)"><rect x="125" y="110" width="232" height="140" rx="8" fill="#1e1e2e"/><path d="M112 250 L365 250 L372 266 L105 266 Z" fill="#c9d2dc"/></g><text x="140" y="140" font-family="monospace" font-size="13" fill="#a6e3a1" stroke="none">$ curl -fsSL …/install.sh</text><text x="152" y="160" font-family="monospace" font-size="13" fill="#a6e3a1" stroke="none">  | sh</text><text x="140" y="190" font-family="monospace" font-size="13" fill="#cdd6f4" stroke="none">Installing Docker… ✓</text><rect x="140" y="204" width="9" height="15" fill="#cdd6f4" stroke="none"/><g filter="url(#wob)"><circle cx="62" cy="175" r="17" fill="#fffdf5"/><path d="M62 192 L62 254"/><path d="M62 202 L117 242"/><path d="M62 202 L122 234"/><path d="M62 254 L40 318"/><path d="M62 254 L84 318"/><circle cx="56" cy="172" r="2" fill="#222" stroke="none"/><circle cx="68" cy="172" r="2" fill="#222" stroke="none"/><path d="M56 182 L68 180"/></g><g filter="url(#wob)"><rect x="15" y="62" width="135" height="52" rx="18" fill="#fff"/><path d="M70.5 111 L60 152 L92.5 111 Z" fill="#fff" stroke="none"/><path d="M70.5 114 L60 152 L92.5 114"/></g><text x="82.5" y="94.3" text-anchor="middle" font-size="18" fill="#222" stroke="none"><tspan x="82.5" dy="0">That's it?</tspan></text></g>
<g transform="translate(20 420)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">4</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Pick your apps</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">the installer asks; Enter keeps the suggestion</text><g filter="url(#wob)"><rect x="150" y="78" width="210" height="200" rx="10" fill="#fff"/></g><rect x="170" y="95" width="24" height="24" rx="5" fill="#e9f7ee"/><path d="M175 107 L181 114 L192 98" stroke="#2ea44f" stroke-width="4" fill="none"/><text x="206" y="114" font-size="19" fill="#222" stroke="none">Splitwiz</text><rect x="170" y="139" width="24" height="24" rx="5" fill="#e9f7ee"/><path d="M175 151 L181 158 L192 142" stroke="#2ea44f" stroke-width="4" fill="none"/><text x="206" y="158" font-size="19" fill="#222" stroke="none">should-we</text><rect x="170" y="183" width="24" height="24" rx="5" fill="#e9f7ee"/><path d="M175 195 L181 202 L192 186" stroke="#2ea44f" stroke-width="4" fill="none"/><text x="206" y="202" font-size="19" fill="#222" stroke="none">Flowy</text><rect x="170" y="227" width="24" height="24" rx="5" fill="#fff"/><text x="206" y="246" font-size="19" fill="#222" stroke="none">Troye</text><g filter="url(#wob)"><circle cx="75" cy="150" r="17" fill="#fffdf5"/><path d="M75 167 L75 229"/><path d="M75 177 L40 217"/><path d="M75 177 L163 139"/><path d="M75 229 L53 293"/><path d="M75 229 L97 293"/><circle cx="69" cy="147" r="2" fill="#222" stroke="none"/><circle cx="81" cy="147" r="2" fill="#222" stroke="none"/><path d="M67 154 Q75 165 83 154 Z" fill="#222"/></g><g filter="url(#wob)"><rect x="12" y="62" width="128" height="50" rx="18" fill="#fff"/><path d="M64.0 109 L65 130 L86.0 109 Z" fill="#fff" stroke="none"/><path d="M64.0 112 L65 130 L86.0 112"/></g><text x="76.0" y="93.3" text-anchor="middle" font-size="18" fill="#222" stroke="none"><tspan x="76.0" dy="0">Ooh, yes!</tspan></text></g>
<g transform="translate(420 420)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">5</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Tap one link</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">gives your apps https:// for your phones</text><g filter="url(#wob)"><rect x="210" y="80" width="120" height="215" rx="18" fill="#fff"/><rect x="222" y="100" width="96" height="170" rx="6" fill="#eef4fb"/><rect x="232" y="205" width="76" height="30" rx="15" fill="#4a90d9"/></g><text x="270" y="135" text-anchor="middle" font-size="15" fill="#222" stroke="none">Sign in to</text><text x="270" y="157" text-anchor="middle" font-size="15" fill="#222" stroke="none">Tailscale</text><text x="270" y="226" text-anchor="middle" font-size="15" fill="#fff" stroke="none">Go</text><path d="M286 238 L300 252 M300 238 L286 252" stroke="none"/><g filter="url(#wob)"><circle cx="105" cy="150" r="17" fill="#fffdf5"/><path d="M105 167 L105 229"/><path d="M105 177 L65 217"/><path d="M105 177 L200 229"/><path d="M105 229 L83 293"/><path d="M105 229 L127 293"/><circle cx="99" cy="147" r="2" fill="#222" stroke="none"/><circle cx="111" cy="147" r="2" fill="#222" stroke="none"/><path d="M98 155 Q105 162 112 155"/></g><path d="M325 210 l10 -8 M327 222 l13 0 M325 234 l10 8" stroke="#ffd84d" stroke-width="3"/><g filter="url(#wob)"><rect x="15" y="62" width="165" height="52" rx="18" fill="#fff"/><path d="M85.5 111 L95 132 L107.5 111 Z" fill="#fff" stroke="none"/><path d="M85.5 114 L95 132 L107.5 114"/></g><text x="97.5" y="94.65" text-anchor="middle" font-size="19" fill="#222" stroke="none"><tspan x="97.5" dy="0">*tap*</tspan></text></g>
<g transform="translate(820 420)"><rect x="2" y="2" width="376" height="376" rx="14" fill="#fffdf5" filter="url(#wob)"/><circle cx="34" cy="34" r="17" fill="#ffd84d"/><text x="34" y="41" text-anchor="middle" font-size="20" font-weight="bold" fill="#222" stroke="none">6</text><text x="60" y="41" font-size="21" font-weight="bold" fill="#222" stroke="none">Your apps, your phone</text><text x="190.0" y="364" text-anchor="middle" font-size="13.5" fill="#555" stroke="none">installed from the browser, data on your box</text><g filter="url(#wob)"><path d="M225 170 L290 115 L355 170 L355 270 L225 270 Z" fill="#fff4d6"/><rect x="275" y="220" width="30" height="50" fill="#fff"/><path d="M290 160 C280 145 260 155 270 170 L290 188 L310 170 C320 155 300 145 290 160 Z" fill="#ff7aa8"/><rect x="135" y="120" width="62" height="110" rx="10" fill="#fff"/></g><rect x="146" y="136" width="18" height="18" rx="5" fill="#2ea44f" stroke="none"/><rect x="170" y="136" width="18" height="18" rx="5" fill="#4a90d9" stroke="none"/><rect x="146" y="162" width="18" height="18" rx="5" fill="#ff7aa8" stroke="none"/><rect x="170" y="162" width="18" height="18" rx="5" fill="#ffd84d" stroke="none"/><g filter="url(#wob)"><circle cx="80" cy="150" r="17" fill="#fffdf5"/><path d="M80 167 L80 229"/><path d="M80 177 L32 127"/><path d="M80 177 L138 185"/><path d="M80 229 L50 289"/><path d="M80 229 L106 293"/><circle cx="74" cy="147" r="2" fill="#222" stroke="none"/><circle cx="86" cy="147" r="2" fill="#222" stroke="none"/><path d="M72 154 Q80 165 88 154 Z" fill="#222"/></g><path d="M30 150 l-10 -6 M34 168 l-13 1" stroke="#ffd84d" stroke-width="3"/><g filter="url(#wob)"><rect x="40" y="60" width="210" height="50" rx="18" fill="#fff"/><path d="M133.0 107 L110 133 L155.0 107 Z" fill="#fff" stroke="none"/><path d="M133.0 110 L110 133 L155.0 110"/></g><text x="145.0" y="90.95" text-anchor="middle" font-size="17" fill="#222" stroke="none"><tspan x="145.0" dy="0">My data stays home!</tspan></text></g>
</g></svg>
