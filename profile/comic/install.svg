<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-labelledby="t d">
<title id="t">Install selfhostit apps in three steps</title><desc id="d">A person finds an old laptop or a Raspberry Pi, pastes one install line in a terminal and picks apps, then opens every app in a browser at home.</desc>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2340" flood-opacity=".14"/></filter></defs>
<g transform="translate(0 0)"><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#ga)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Find a little computer*</text><rect x="40" y="92" width="140" height="92" rx="10" fill="#2a2e45" filter="url(#sh)"/><rect x="48" y="100" width="124" height="78" rx="5" fill="#e8ecfb"/><path d="M24 184 L196 184 L186 196 L34 196 Z" fill="#c9cede"/><text x="110" y="142" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b6080" text-anchor="middle">old laptop</text><g transform="translate(62 226) scale(1)"><rect width="96" height="64" rx="8" fill="#2ea44f"/><rect x="20" y="18" width="26" height="26" rx="3" fill="#1d2b22"/><circle cx="10.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="18.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="27.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="35.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="44.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="52.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="61.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="69.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="78.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="86.5" cy="7" r="2.2" fill="#ffd166"/><rect x="72" y="22" width="30" height="20" rx="3" fill="#c7ccd6"/><rect x="58" y="48" width="14" height="10" rx="2" fill="#c7ccd6"/></g><text x="110" y="312" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b6080" text-anchor="middle">Raspberry Pi 3+</text><g transform="translate(286 330) scale(.8) translate(-286 -330)"><path d="M277 262 L272 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="268" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M295 262 L300 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="304" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M269 208 L232 262" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="232" cy="262" r="7" fill="#f4c3a1"/><path d="M303 208 L330 196" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="330" cy="196" r="7" fill="#f4c3a1"/><rect x="262" y="198" width="48" height="72" rx="18" fill="#5b5bd6"/><rect x="280" y="196" width="12" height="10" fill="#f4c3a1"/><circle cx="286" cy="178" r="22" fill="#f4c3a1"/><path d="M263 176 C262 148 310 148 309 176 C298 164 278 162 263 176 Z" fill="#3a2c2a"/><circle cx="278" cy="180" r="2.6" fill="#1f2340"/><circle cx="294" cy="180" r="2.6" fill="#1f2340"/><circle cx="273" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><circle cx="299" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><path d="M279 187 Q286 197 293 187 Z" fill="#1f2340"/></g><path d="M322 166 l10 -10 M336 182 l14 -4 M314 152 l2 -14" stroke="#f2a93b" stroke-width="4" stroke-linecap="round"/><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">An old laptop, a mini PC, a NAS or a Pi.</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">On a Pi, Raspberry Pi Imager puts Linux on it.</text></g>
<g transform="translate(400 0)"><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gb)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Paste one line</text><rect x="28" y="78" width="324" height="104" rx="16" fill="#1c1f33" filter="url(#sh)" /><circle cx="48" cy="94" r="5" fill="#ff5f57"/><circle cx="64" cy="94" r="5" fill="#febc2e"/><circle cx="80" cy="94" r="5" fill="#28c840"/><text x="46" y="120" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#9ef0b4" text-anchor="start">$ curl -fsSL …/install.sh | sh</text><text x="46" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Which apps? 1 2 3</text><text x="46" y="164" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Starting Splitwiz… ✓</text><g transform="translate(80 330) scale(.8) translate(-80 -330)"><path d="M71 262 L66 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="62" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M89 262 L94 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="98" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M63 208 L150 262" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="150" cy="262" r="7" fill="#f4c3a1"/><path d="M97 208 L176 256" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="176" cy="256" r="7" fill="#f4c3a1"/><rect x="56" y="198" width="48" height="72" rx="18" fill="#5b5bd6"/><rect x="74" y="196" width="12" height="10" fill="#f4c3a1"/><circle cx="80" cy="178" r="22" fill="#f4c3a1"/><path d="M57 176 C56 148 104 148 103 176 C92 164 72 162 57 176 Z" fill="#3a2c2a"/><circle cx="72" cy="180" r="2.6" fill="#1f2340"/><circle cx="88" cy="180" r="2.6" fill="#1f2340"/><circle cx="67" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><circle cx="93" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><path d="M74 188 Q80 193 86 188" stroke="#1f2340" stroke-width="2.2" fill="none" stroke-linecap="round"/></g><rect x="118" y="262" width="220" height="12" rx="6" fill="#c9cede"/><rect x="222" y="274" width="12" height="56" fill="#c9cede"/><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">In a terminal on it, or over SSH. It installs</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Docker and asks which apps you want.</text></g>
<g transform="translate(800 0)"><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gc)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Open them at home</text><rect x="30" y="78" width="320" height="108" rx="16" fill="#fff" filter="url(#sh)" /><rect x="30" y="78" width="320" height="34" rx="16" fill="#eef0f7"/><rect x="30" y="96" width="320" height="16" fill="#eef0f7"/><rect x="46" y="86" width="230" height="20" rx="10" fill="#fff"/><text x="58" y="101" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#5b6080" text-anchor="start">http://homeserver:8090</text><rect x="56" y="122" width="36" height="36" rx="11" fill="#2ea44f"/><text x="74" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Splitwiz</text><rect x="134" y="122" width="36" height="36" rx="11" fill="#f2a93b"/><text x="152" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">should-we</text><rect x="212" y="122" width="36" height="36" rx="11" fill="#e5508a"/><text x="230" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Flowy</text><rect x="290" y="122" width="36" height="36" rx="11" fill="#3b82f6"/><text x="308" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Troye</text><g transform="translate(190 332) scale(.8) translate(-190 -332)"><path d="M181 264 L176 332" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="172" cy="335" rx="11" ry="5" fill="#1f2340"/><path d="M199 264 L204 332" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="208" cy="335" rx="11" ry="5" fill="#1f2340"/><path d="M173 210 L150 262" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="150" cy="262" r="7" fill="#f4c3a1"/><path d="M207 210 L240 214" stroke="#5b5bd6" stroke-width="12" stroke-linecap="round"/><circle cx="240" cy="214" r="7" fill="#f4c3a1"/><rect x="166" y="200" width="48" height="72" rx="18" fill="#5b5bd6"/><rect x="184" y="198" width="12" height="10" fill="#f4c3a1"/><circle cx="190" cy="180" r="22" fill="#f4c3a1"/><path d="M167 178 C166 150 214 150 213 178 C202 166 182 164 167 178 Z" fill="#3a2c2a"/><circle cx="182" cy="182" r="2.6" fill="#1f2340"/><circle cx="198" cy="182" r="2.6" fill="#1f2340"/><circle cx="177" cy="189" r="3.5" fill="#f29b8f" opacity=".55"/><circle cx="203" cy="189" r="3.5" fill="#f29b8f" opacity=".55"/><path d="M183 189 Q190 199 197 189 Z" fill="#1f2340"/></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Every app works in a browser on your</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">home network right away. Done!</text></g>
</svg>
