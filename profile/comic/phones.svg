th="3" fill="none" stroke-linecap="round"/><g transform="translate(84 330) scale(.8) translate(-84 -330)"><path d="M75 262 L70 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="66" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M93 262 L98 330" stroke="#2d3250" stroke-width="13" stroke-linecap="round"/><ellipse cx="102" cy="333" rx="11" ry="5" fill="#1f2340"/><path d="M67 208 L52 268" stroke="#0f9f8f" stroke-width="12" stroke-linecap="round"/><circle cx="52" cy="268" r="7" fill="#f4c3a1"/><path d="M101 208 L150 244" stroke="#0f9f8f" stroke-width="12" stroke-linecap="round"/><circle cx="150" cy="244" r="7" fill="#f4c3a1"/><rect x="60" y="198" width="48" height="72" rx="18" fill="#0f9f8f"/><rect x="78" y="196" width="12" height="10" fill="#f4c3a1"/><circle cx="84" cy="178" r="22" fill="#f4c3a1"/><path d="M61 176 C60 148 108 148 107 176 C96 164 76 162 61 176 Z" fill="#3a2c2a"/><circle cx="76" cy="180" r="2.6" fill="#1f2340"/><circle cx="92" cy="180" r="2.6" fill="#1f2340"/><circle cx="71" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><circle cx="97" cy="187" r="3.5" fill="#f29b8f" opacity=".55"/><path d="M78 188 Q84 193 90 188" stroke="#1f2340" stroke-width="2.2" fill="none" stroke-linecap="round"/></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">The installer runs Tailscale for all your apps.</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">You only open its link and sign in.</text></g>
